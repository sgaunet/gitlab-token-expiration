version: 2
project_name: "gitlab-token-expiration"
before:
  hooks:
    - go mod download
builds:
  - env:
      - CGO_ENABLED=0
    # dir: cmd
    ldflags:
      - -X github.com/sgaunet/gitlab-token-expiration/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"

archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: ["binary"]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Homebrew cask publishing (replaces the deprecated `brews:` block; casks are
# what GoReleaser supports going forward)
homebrew_casks:
  - name: gitlab-token-expiration
    homepage: 'https://github.com/sgaunet/gitlab-token-expiration'
    description: 'List expiration dates of GitLab project, group and personal access tokens'

    # Tap repository directory (casks live in Casks/, not Formula/)
    directory: Casks

    # Use the default (tar.gz) archive, not the raw binary one.
    ids: [default]

    # Command name users invoke, mapped from the artifact name.
    binaries:
      - gitlab-token-expiration

    # Download URL of the release artifact.
    url:
      template: 'https://github.com/sgaunet/gitlab-token-expiration/releases/download/{{ .Tag }}/{{ .ArtifactName }}'

    # Strip the Gatekeeper quarantine xattr so the installed binary can run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end

    commit_author:
      name: sgaunet
      email: 1552102+sgaunet@users.noreply.github.com

    repository:
      owner: sgaunet
      name: homebrew-tools
      # Token with 'repo' scope is required for pushing to a different repository
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
