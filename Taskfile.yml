# https://taskfile.dev
version: '3'
vars:
  BINFILE: gitlab-token-expiration

tasks:
  default:
    desc: "List tasks"
    cmds:
      - task -a

  lint:
    desc: "Run linter"
    cmds:
      - go generate ./...
      - golangci-lint run

  test:
    desc: "Run the tests with the race detector"
    cmds:
      - go test -race ./...

  vulncheck:
    desc: "Scan dependencies for known vulnerabilities"
    cmds:
      - govulncheck ./...

  build:
    desc: "Build the binary"
    cmds:
      - CGO_ENABLED=0 go build cmd/*.go

  doc:
    desc: "Start godoc server"
    cmds:
      - echo http://localhost:6060 
      - godoc -http=:6060

  snapshot:
    desc: "Create a snapshot release"
    cmds:
      - GITLAB_TOKEN="" goreleaser --clean --snapshot
    
  release:
    desc: "Create a release"
    cmds:
      - GITLAB_TOKEN="" goreleaser --clean --skip validate
    